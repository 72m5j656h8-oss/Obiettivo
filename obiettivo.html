<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obiettivo">
<meta name="theme-color" content="#0E1116">
<title>Obiettivo</title>
<style>
  :root{
    --bg:#0E1116; --surface:#161A21; --surface2:#1C222B; --line:#232A34;
    --text:#E6E9EE; --muted:#8A93A2; --faint:#5A6472;
    --win:#3FB68B; --loss:#E5675B; --amber:#E0A458;
    --data:ui-monospace,'SF Mono',Menlo,monospace;
    --body:-apple-system,system-ui,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  button{font-family:inherit;cursor:pointer;border:none;}
  input{font-family:inherit;}
  input:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .wrap{max-width:520px;margin:0 auto;padding:24px 18px 44px;}
  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
  .eyebrow{font-family:var(--data);font-size:11px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;}
  .link{background:none;color:var(--muted);font-family:var(--data);font-size:12px;}
  .field{margin-bottom:14px;}
  .flabel{font-size:12px;color:var(--muted);margin-bottom:7px;}
  input.in{width:100%;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:16px;font-family:var(--data);outline:none;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:11px 8px;border-radius:10px;font-size:14px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line);}
  .seg button.on{background:var(--text);color:var(--bg);border-color:var(--text);}
  .primary{width:100%;padding:15px;border-radius:13px;font-weight:650;font-size:15px;background:var(--text);color:var(--bg);}
  .primary:disabled{background:var(--surface2);color:var(--faint);}
  .ghost{flex:1;padding:13px;border-radius:12px;background:var(--surface2);color:var(--text);font-weight:600;font-size:13px;border:1px solid var(--line);}
  .muted{color:var(--muted);} .faint{color:var(--faint);}
  .lead{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 18px;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.04);}100%{transform:scale(1);}}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
  .totalName{font-family:var(--data);font-size:12px;color:var(--faint);margin-bottom:4px;}
  .totalRow{display:flex;align-items:baseline;gap:12px;}
  .totalBig{font-family:var(--data);font-size:44px;font-weight:600;letter-spacing:-1px;line-height:1;}
  .totalDelta{font-family:var(--data);font-size:15px;}
  .totalSub{font-family:var(--data);font-size:12px;color:var(--faint);margin-top:6px;}
  .bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;}
  .barFill{height:100%;border-radius:4px;transition:width .35s ease;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;}
  .remBig{font-family:var(--data);font-size:40px;font-weight:600;color:var(--amber);line-height:1;}
  .counts{font-family:var(--data);font-size:12px;color:var(--faint);margin-top:12px;display:flex;gap:16px;}
  .opField{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .opInputRow{display:flex;align-items:center;gap:10px;}
  .opInputRow input{flex:1;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:20px;font-family:var(--data);outline:none;text-align:center;}
  .opUnit{font-family:var(--data);font-size:18px;color:var(--muted);width:22px;text-align:center;}
  .big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 8px;border-radius:16px;color:#0E1116;font-weight:700;font-size:18px;}
  .bigSub{font-size:12px;font-weight:500;opacity:.85;}
  .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .rowbar{width:4px;align-self:stretch;min-height:22px;border-radius:2px;}
  .histTitle{font-family:var(--data);font-size:11px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;margin:26px 0 8px;}
  .overlay{position:fixed;inset:0;background:#000A;display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:8px 18px 26px;animation:rise .25s ease;}
  .handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">Obiettivo</div>
    <button id="settingsBtn" class="link" style="display:none">impostazioni</button>
  </div>
  <div id="root"></div>
</div>
<div id="modalRoot"></div>

<script>
const KEY = "obiettivo:v1";
let state = migrate(load());
let currentVal = null; // valore dell'operazione in corso (%, o €)

function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function migrate(s){
  if(s && s.settings && s.settings.defVal==null){
    s.settings.defVal = (s.settings.win!=null ? s.settings.win : 10);
  }
  return s;
}
function num(v){ return parseFloat(String(v).replace(",", ".")); }
function fmt(n){ return "€" + n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function valLabel(v){ return state.settings.mode==="percent" ? v+"%" : fmt(v); }

function opValue(op, settings){
  const v = (op.val!=null) ? op.val : settings.defVal;
  return v;
}

function compute(settings, ops, assumedVal){
  const {budget,target,mode} = settings;
  let total = budget; const series=[budget]; let wins=0, losses=0;
  for(const op of ops){
    const v = opValue(op, settings);
    if(op.kind==="win"){ wins++; total = mode==="percent" ? total*(1+v/100) : total+v; }
    else { losses++; total = mode==="percent" ? total*(1-v/100) : total-v; }
    series.push(total);
  }
  const av = (assumedVal!=null && assumedVal>0) ? assumedVal : settings.defVal;
  let remaining=null;
  if(total>=target) remaining=0;
  else if(mode==="percent"){ if(total>0 && av>0) remaining=Math.ceil(Math.log(target/total)/Math.log(1+av/100)); }
  else { if(av>0) remaining=Math.ceil((target-total)/av); }
  const progress = target>budget ? Math.max(0,Math.min(1,(total-budget)/(target-budget))) : (total>=target?1:0);
  return {total,series,wins,losses,remaining,progress};
}

function render(){
  const root = document.getElementById("root");
  const sBtn = document.getElementById("settingsBtn");
  if(!state || !state.settings){ sBtn.style.display="none"; renderSetup(root); }
  else { sBtn.style.display="block"; renderTracker(root); }
}

// ── Setup ────────────────────────────────────────────────
function renderSetup(root){
  root.innerHTML = `
    <p class="lead">Imposta da dove parti e dove vuoi arrivare. Poi registri le operazioni una a una, scegliendo il valore di ognuna.</p>
    <div class="field"><div class="flabel">Budget iniziale (€)</div><input id="s_budget" class="in" inputmode="decimal" value="100"></div>
    <div class="field"><div class="flabel">Obiettivo (€)</div><input id="s_target" class="in" inputmode="decimal" value="500"></div>
    <div class="field"><div class="flabel">Come conti ogni operazione</div>
      <div class="seg" id="s_mode">
        <button data-v="percent" class="on">Percentuale</button>
        <button data-v="fixed">Importo fisso</button>
      </div>
    </div>
    <div class="field"><div class="flabel" id="s_defL">Valore predefinito per operazione (%)</div><input id="s_def" class="in" inputmode="decimal" value="10"></div>
    <button id="s_start" class="primary" style="margin-top:8px">Inizia</button>
  `;
  let mode="percent";
  const modeEl = root.querySelector("#s_mode");
  modeEl.addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    mode = b.dataset.v;
    [...modeEl.children].forEach(c=>c.classList.toggle("on", c===b));
    root.querySelector("#s_defL").textContent = mode==="percent" ? "Valore predefinito per operazione (%)" : "Valore predefinito per operazione (€)";
  });
  root.querySelector("#s_start").addEventListener("click", ()=>{
    const budget=num(root.querySelector("#s_budget").value);
    const target=num(root.querySelector("#s_target").value);
    const defVal=num(root.querySelector("#s_def").value);
    if(!(budget>0)||!(target>0)||!(defVal>0)){ alert("Controlla i valori: budget, obiettivo e valore predefinito devono essere positivi."); return; }
    state = { settings:{budget,target,mode,defVal}, ops:[] };
    currentVal = defVal;
    save(); render();
  });
}

// ── Tracker ──────────────────────────────────────────────
function renderTracker(root){
  const {settings,ops} = state;
  if(currentVal==null) currentVal = settings.defVal;
  const s = compute(settings, ops, currentVal);
  const reached = s.total>=settings.target;
  const up = s.total>=settings.budget;
  const unit = settings.mode==="percent" ? "%" : "€";

  const remBlock = reached
    ? `<div style="font-family:var(--data);font-size:11px;letter-spacing:1.5px;color:var(--win);text-transform:uppercase">Obiettivo raggiunto</div>
       <div style="font-size:15px;color:var(--muted);margin-top:6px">Hai superato ${fmt(settings.target)}. Alza l'asticella dalle impostazioni.</div>`
    : `<div style="display:flex;align-items:baseline;gap:12px">
         <div class="remBig" id="remNum">${s.remaining==null?"—":s.remaining}</div>
         <div style="font-size:14px;color:var(--muted);line-height:1.35">operazioni vinte di fila per arrivare a ${fmt(settings.target)}<br><span class="faint" id="remNote">a ${valLabel(currentVal)} a operazione</span></div>
       </div>`;

  const hist = ops.length ? `<div class="histTitle">Storico</div>` + ops.map((op,i)=>{
      const idx = i+1; const totalAt = s.series[idx]; const v = opValue(op, settings);
      const sign = op.kind==="win" ? "+" : "−";
      return `<div class="row">
        <div class="rowbar" style="background:${op.kind==="win"?"var(--win)":"var(--loss)"}"></div>
        <span style="font-family:var(--data);font-size:12px;color:var(--faint);width:28px">#${idx}</span>
        <span style="flex:1;font-size:14px;font-weight:600;color:${op.kind==="win"?"var(--win)":"var(--loss)"}">${op.kind==="win"?"Vinta":"Persa"} <span style="font-weight:500;color:var(--muted)">${sign}${valLabel(v)}</span></span>
        <span style="font-family:var(--data);font-size:13px;color:var(--muted)">${fmt(totalAt)}</span>
      </div>`;
    }).reverse().join("") : "";

  root.innerHTML = `
    <div style="animation:pop .25s ease">
      <div class="totalName">Totale attuale</div>
      <div class="totalRow">
        <div class="totalBig" style="color:${reached?"var(--win)":"var(--text)"}">${fmt(s.total)}</div>
        <div class="totalDelta" style="color:${up?"var(--win)":"var(--loss)"}">${up?"+":""}${(s.total-settings.budget).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})}€</div>
      </div>
      <div class="totalSub">da ${fmt(settings.budget)} · obiettivo ${fmt(settings.target)}</div>
    </div>

    <div style="margin:18px 0">
      <div class="bar"><div class="barFill" style="width:${s.progress*100}%;background:${reached?"var(--win)":"var(--amber)"}"></div></div>
      <div style="font-family:var(--data);font-size:11px;color:var(--muted);margin-top:6px;text-align:right">${Math.round(s.progress*100)}% dell'obiettivo</div>
    </div>

    <div class="card" style="border-color:${reached?"var(--win)":"var(--line)"}">
      ${remBlock}
      <div class="counts">
        <span style="color:var(--win)">${s.wins} vinte</span>
        <span style="color:var(--loss)">${s.losses} perse</span>
        <span>${ops.length} totali</span>
      </div>
    </div>

    ${reached ? "" : `
    <div class="opField">
      <div class="flabel">Valore di questa operazione (${unit})</div>
      <div class="opInputRow">
        <span class="opUnit">${unit==="%"?"%":"€"}</span>
        <input id="opVal" inputmode="decimal" value="${currentVal}">
      </div>
    </div>

    <div class="grid2">
      <button id="t_win" class="big" style="background:var(--win)">Vinta<span class="bigSub" id="winSub">+${valLabel(currentVal)}</span></button>
      <button id="t_loss" class="big" style="background:var(--loss)">Persa<span class="bigSub" id="lossSub">−${valLabel(currentVal)}</span></button>
    </div>`}

    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="t_undo" class="ghost" ${ops.length?"":"style=opacity:.4"} ${ops.length?"":"disabled"}>Annulla ultima</button>
      <button id="t_reset" class="ghost" ${ops.length?"":"style=opacity:.4"} ${ops.length?"":"disabled"}>Ricomincia</button>
    </div>

    ${hist}
  `;

  if(!reached){
    const opInput = root.querySelector("#opVal");
    const winSub = root.querySelector("#winSub");
    const lossSub = root.querySelector("#lossSub");
    const remNum = root.querySelector("#remNum");
    const remNote = root.querySelector("#remNote");
    opInput.addEventListener("input", ()=>{
      const v = num(opInput.value);
      if(v>0){
        currentVal = v;
        winSub.textContent = "+"+valLabel(v);
        lossSub.textContent = "−"+valLabel(v);
        const s2 = compute(settings, ops, v);
        if(remNum) remNum.textContent = s2.remaining==null ? "—" : s2.remaining;
        if(remNote) remNote.textContent = "a "+valLabel(v)+" a operazione";
      }
    });
    root.querySelector("#t_win").addEventListener("click", ()=>{
      const v = num(opInput.value); if(!(v>0)){ alert("Inserisci un valore maggiore di zero."); return; }
      currentVal = v; state.ops.push({kind:"win",val:v,ts:Date.now()}); save(); render();
    });
    root.querySelector("#t_loss").addEventListener("click", ()=>{
      const v = num(opInput.value); if(!(v>0)){ alert("Inserisci un valore maggiore di zero."); return; }
      currentVal = v; state.ops.push({kind:"loss",val:v,ts:Date.now()}); save(); render();
    });
  }

  const undo = root.querySelector("#t_undo");
  if(ops.length) undo.addEventListener("click", ()=>{ state.ops.pop(); save(); render(); });
  const reset = root.querySelector("#t_reset");
  if(ops.length) reset.addEventListener("click", ()=>{
    if(confirm("Azzerare tutte le operazioni? Il budget e l'obiettivo restano.")){ state.ops=[]; save(); render(); }
  });
}

// ── Settings modal ───────────────────────────────────────
function openSettings(){
  const st = state.settings;
  const m = document.getElementById("modalRoot");
  m.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet" id="sheet">
        <div class="handle"></div>
        <div style="font-size:15px;font-weight:650;margin-bottom:14px">Impostazioni</div>
        <div class="field"><div class="flabel">Budget iniziale (€)</div><input id="m_budget" class="in" inputmode="decimal" value="${st.budget}"></div>
        <div class="field"><div class="flabel">Obiettivo (€)</div><input id="m_target" class="in" inputmode="decimal" value="${st.target}"></div>
        <div class="field"><div class="flabel">Conteggio</div>
          <div class="seg" id="m_mode">
            <button data-v="percent" class="${st.mode==="percent"?"on":""}">Percentuale</button>
            <button data-v="fixed" class="${st.mode==="fixed"?"on":""}">Importo fisso</button>
          </div>
        </div>
        <div class="field"><div class="flabel" id="m_defL">${st.mode==="percent"?"Valore predefinito (%)":"Valore predefinito (€)"}</div><input id="m_def" class="in" inputmode="decimal" value="${st.defVal}"></div>
        <div style="font-size:12px;color:var(--faint);margin-bottom:12px">Il valore predefinito è solo quello già compilato: puoi cambiarlo a ogni operazione. Cambiare budget o conteggio ricalcola il totale.</div>
        <button id="m_save" class="primary">Salva</button>
        <button id="m_wipe" class="ghost" style="margin-top:10px;width:100%;color:var(--muted)">Ricomincia da zero</button>
      </div>
    </div>`;
  let mode = st.mode;
  const modeEl = m.querySelector("#m_mode");
  modeEl.addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return; mode=b.dataset.v;
    [...modeEl.children].forEach(c=>c.classList.toggle("on", c===b));
    m.querySelector("#m_defL").textContent = mode==="percent"?"Valore predefinito (%)":"Valore predefinito (€)";
  });
  m.querySelector("#ov").addEventListener("click", e=>{ if(e.target.id==="ov") close(); });
  function close(){ m.innerHTML=""; }
  m.querySelector("#m_save").addEventListener("click", ()=>{
    const budget=num(m.querySelector("#m_budget").value);
    const target=num(m.querySelector("#m_target").value);
    const defVal=num(m.querySelector("#m_def").value);
    if(!(budget>0)||!(target>0)||!(defVal>0)){ alert("Controlla i valori."); return; }
    state.settings={budget,target,mode,defVal}; currentVal=defVal; save(); close(); render();
  });
  m.querySelector("#m_wipe").addEventListener("click", ()=>{
    if(confirm("Cancellare tutto (budget, obiettivo e operazioni) e ripartire da zero?")){ state=null; currentVal=null; save(); close(); render(); }
  });
}

document.getElementById("settingsBtn").addEventListener("click", openSettings);

// ── App icon per "Aggiungi a Home" (generata al volo) ────
(function makeIcon(){
  try{
    const c=document.createElement("canvas"); c.width=180; c.height=180;
    const x=c.getContext("2d");
    const g=x.createLinearGradient(0,0,0,180); g.addColorStop(0,"#1C222B"); g.addColorStop(1,"#0E1116");
    x.fillStyle=g; x.fillRect(0,0,180,180);
    x.lineWidth=12; x.strokeStyle="#232A34"; x.beginPath(); x.arc(90,90,52,0,Math.PI*2); x.stroke();
    x.strokeStyle="#E0A458"; x.beginPath(); x.arc(90,90,52,-Math.PI/2, Math.PI*0.9); x.stroke();
    x.strokeStyle="#3FB68B"; x.lineWidth=13; x.lineCap="round"; x.lineJoin="round";
    x.beginPath(); x.moveTo(66,108); x.lineTo(90,72); x.lineTo(114,108); x.stroke();
    const url=c.toDataURL("image/png");
    const link=document.createElement("link"); link.rel="apple-touch-icon"; link.href=url; document.head.appendChild(link);
    const fav=document.createElement("link"); fav.rel="icon"; fav.href=url; document.head.appendChild(fav);
  }catch(e){}
})();

render();
</script>
</body>
</html>
